<!DOCTYPE html>
<html>
<head>
    <title>My Documents</title>
</head>
<body>

<h2>My Documents</h2>

<a href="{{ url_for('documents.upload_document') }}">
    Upload New Document
</a>

<br><br>

{% if documents %}

<table border="1" cellpadding="10">

    <tr>
        <th>Document Name</th>
        <th>Category</th>
        <th>Upload Date</th>
    </tr>

    {% for document in documents %}

    <tr>
        <td>{{ document.filename }}</td>
        <td>{{ document.category }}</td>
        <td>{{ document.upload_date }}</td>
    </tr>

    {% endfor %}

</table>

{% else %}

<p>No documents uploaded yet.</p>

{% endif %}

</body>
</html>
