<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureSpace | Forgot Password</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eee6ff, #dce8ff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.card {
    background: white;
    width: 100%;
    max-width: 460px;
    padding: 40px;
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(75,45,150,.2);
}
h1 { color: #17134d; margin-bottom: 10px; }
p { color: #77758a; line-height: 1.6; }
input {
    width: 100%;
    padding: 15px;
    margin: 22px 0;
    border: 1px solid #ded9ec;
    border-radius: 10px;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 30px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(90deg, #7629dc, #4d19c7);
    cursor: pointer;
}
a { display: block; text-align: center; margin-top: 22px; color: #7025d2; text-decoration: none; font-weight: 600; }
.flash { background: #f5eaff; color: #6425b8; padding: 12px; border-radius: 8px; margin: 18px 0; }
</style>
</head>
<body>
<main class="card">
    <h1>Forgot Password?</h1>
    <p>Enter your registered email address. If an account exists, reset instructions will be sent.</p>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" placeholder="Registered email address" maxlength="120" required>
        <button type="submit">Send Reset Instructions</button>
    </form>
    <a href="{{ url_for('auth.login') }}">Back to Login</a>
</main>
</body>
</html>
